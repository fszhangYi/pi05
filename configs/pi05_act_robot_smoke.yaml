# ============================================================
# pi0.5 JAX SFT - act_robot 冒烟集（100 episodes）
# ============================================================

project:
  name: pi05_act_robot_smoke
  exp_name: convert_smoke
  project_name: pi05-act-robot

data:
  repo_id: company/act_robot_three_view_smoke
  dataset_format: tonglu_annotation
  raw_root: /root/autodl-tmp/act_robot/data/raw
  annotation_root: /root/autodl-tmp/act_robot/data/annotation/annotation/restored_txt
  hf_lerobot_home: /root/autodl-tmp/pi05/data/lerobot
  robot_type: custom
  fps: 15
  chest_image_prefix: rgb_chest
  top_image_prefix: rgb_top
  wrist_image_prefix: rgb_wrist_2
  task_name: "pick the workpiece from the cardboard box in order and place it in the grid tray"
  task_prompt_template: "pick the workpiece from the cardboard box in order and place it in the {row} row, {column} column of the grid tray"
  prompt_from_task: true
  normalize_rx_to_2pi: true
  gripper_action_source: next_observation
  max_episodes: 100

model:
  action_horizon: 10
  max_token_len: 200
  discrete_state_input: true
  # Both LoRA: single 32GB GPU cannot hold full action-expert Adam state (OOM ~38GiB).
  paligemma_variant: gemma_2b_lora
  action_expert_variant: gemma_300m_lora

training:
  seed: 42
  batch_size: 2
  fsdp_devices: 1
  num_workers: 2
  num_train_steps: 10000
  log_interval: 50
  save_interval: 2000
  keep_period: 5000
  peak_lr: 1.0e-4
  decay_lr: 1.0e-5
  warmup_steps: 200
  decay_steps: 10000
  ema_decay: null
  clip_gradient_norm: 1.0
  wandb_enabled: false
  overwrite: true
  resume: false

paths:
  assets_base_dir: ./artifacts/assets
  checkpoint_base_dir: ./artifacts/checkpoints
  base_checkpoint_path: ./checkpoints/pi0.5_base/params
  eval_output_dir: ./artifacts/eval
