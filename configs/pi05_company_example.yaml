# ============================================================
# pi0.5 全参微调 — 8 卡 A100  (~552 episodes, ~7.3 万帧)
# 2 卡版本: fsdp_devices=2, batch_size=32, num_train_steps=40000
# ============================================================

project:
  name: pi05_company_jax
  exp_name: 8gpu_full_ft
  project_name: pi05-company

data:
  repo_id: company/pi05_company_task
  raw_root: /home/znyyb/hww/vla/cam_100_15
  hf_lerobot_home: ./data/lerobot
  robot_type: custom
  fps: 15
  wrist_image_prefix: rgb_wrist_1
  task_name: "抓取镜头模组"
  max_episodes: null

model:
  action_horizon: 10
  max_token_len: 200
  discrete_state_input: true   # pi0.5 必须为 true
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m

training:
  seed: 42
  # 8 卡: global_batch=128, per_gpu=16
  # 2 卡: batch_size=32,  fsdp_devices=2, num_train_steps=40000
  batch_size: 128
  fsdp_devices: 8
  num_workers: 8
  # 552 ep × 132 帧 ≈ 7.3 万帧; batch=128 → ~570 步/epoch
  # 20000 步 ≈ 35 epoch (全参推荐区间: 25-40 epoch)
  num_train_steps: 20000
  log_interval: 100
  save_interval: 2000
  keep_period: 10000
  peak_lr: 5.0e-5
  decay_lr: 5.0e-5
  warmup_steps: 500
  decay_steps: 20000
  ema_decay: null   # disabled: saves ~5.5 GB/GPU peak during FSDP init; re-enable if GPU memory allows
  clip_gradient_norm: 1.0
  wandb_enabled: false
  overwrite: false
  resume: false

paths:
  assets_base_dir: ./artifacts/assets
  checkpoint_base_dir: ./artifacts/checkpoints
  base_checkpoint_path: /data/pretrained/pi05_base/params
  eval_output_dir: ./artifacts/eval
