# ============================================================
# Tonglu full-FT reproduce (autodl paths) — serve_abs.sh default recipe
# Matches hww artifacts: pi05_tonglu0630_mlu/mlu_full_ft_abs_pose
# PyTorch · gemma_2b + gemma_300m · batch 256 · 8 GPUs
# ============================================================

project:
  name: pi05_tonglu0630_mlu
  exp_name: mlu_full_ft_abs_pose
  project_name: pi05-tonglu0630_abs_pose

data:
  repo_id: company/tonglu0630_three_view_terminated_abs_pose
  dataset_format: tonglu_annotation
  raw_root: /root/autodl-tmp/datasets/tonglu0630/raw_data
  annotation_root: /root/autodl-tmp/datasets/tonglu0630/annotation
  hf_lerobot_home: ./data/lerobot
  robot_type: custom
  fps: 15
  chest_image_prefix: rgb_chest
  top_image_prefix: rgb_top
  wrist_image_prefix: rgb_wrist_2
  task_name: "pick the workpiece from the cardboard box in order and place it in the grid tray"
  task_prompt_template: "pick the workpiece from the cardboard box in order and place it in the {row} row, {column} column of the grid tray"
  prompt_from_task: true
  normalize_rx_to_2pi: true
  gripper_action_source: next_observation
  max_episodes: null

model:
  action_horizon: 10
  max_token_len: 200
  discrete_state_input: true
  paligemma_variant: gemma_2b
  action_expert_variant: gemma_300m
  rtc_simulated_delay: null

training:
  seed: 42
  batch_size: 256
  fsdp_devices: 8
  num_workers: 8
  num_train_steps: 16000
  log_interval: 100
  save_interval: 2000
  keep_period: 10000
  peak_lr: 5.0e-5
  decay_lr: 5.0e-5
  warmup_steps: 500
  decay_steps: 20000
  ema_decay: null
  clip_gradient_norm: 1.0
  wandb_enabled: false
  overwrite: false
  resume: false

paths:
  assets_base_dir: ./artifacts/assets
  checkpoint_base_dir: ./artifacts/checkpoints
  base_checkpoint_path: ./checkpoints/pi05_base_pytorch
  eval_output_dir: ./artifacts/eval
